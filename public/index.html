<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flux">
<title>Flux – Aufgaben & Notizen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f3f4f9;--panel:#fff;--panel2:#f7f8fc;--text:#161826;--muted:#6b7090;--line:#e5e7f0;--accent:#6366f1;--accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);--danger:#ef4444;--ok:#10b981;--p1:#ef4444;--p2:#f59e0b;--p3:#3b82f6;--p4:#a0a6c0;--shadow:0 1px 2px rgba(20,24,50,.05),0 10px 30px rgba(20,24,50,.07);--r:14px;--side:268px}
:root[data-mode=dark]{--bg:#0d0e16;--panel:#161827;--panel2:#1b1e30;--text:#eceefa;--muted:#8b90b2;--line:#262a41;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:var(--side) 1fr;height:100dvh;overflow:hidden}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-size:20px;letter-spacing:-.02em}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ec4899));display:grid;place-items:center;color:#fff}
.brand .logo svg{width:19px;height:19px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;color:var(--muted);text-align:left;font-weight:500;min-height:44px}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);padding:1px 8px;border-radius:99px}
.nav.on em{background:var(--accent);color:#fff}
.nav kbd{margin-left:auto;font:11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none;margin:0 5px}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 12px 4px;font-weight:600}
.grow{flex:1}
/* main */
.main{display:flex;min-width:0;height:100dvh;position:relative}
.col{flex:1;min-width:0;overflow:auto;padding:28px 32px 60px}
.col-in{max-width:860px;margin:0 auto}
.main.v-notes .col{flex:0 0 330px;padding:20px 16px;border-right:1px solid var(--line);background:var(--panel)}
.main.v-cal .col{padding:22px 24px}
.main.v-cal .col-in{max-width:none}
.main.v-cal .detail{width:350px}
.detail{display:none;width:410px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:22px 22px 60px}
.detail.show{display:block}
.main.v-notes .detail{flex:1;width:auto;padding:0;display:flex;flex-direction:column;border:0;background:var(--bg)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:30px;letter-spacing:-.03em;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0}
.ghost{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:11px;color:var(--muted);font-weight:500;min-height:40px}
.ghost:hover{background:var(--panel);color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;background:var(--accent);color:#fff;font-weight:600;min-height:42px}
.btn.sec2{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
/* quick add */
.qa{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 6px 6px 16px;box-shadow:var(--shadow);margin-bottom:6px;align-items:center}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.qa input{flex:1;border:0;outline:0;background:none;padding:10px 0;min-width:0;font-size:16px}
.qp{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;padding:6px 4px 14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.mute{background:var(--panel2);color:var(--muted)}
.pill.late{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.pill.area{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
/* groups & rows */
.grp{margin-top:20px}
.grp h3{margin:0 0 8px 4px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.01em;display:flex;gap:8px;align-items:center}
.grp h3.late{color:var(--danger)}
.grp h3 span{font-weight:500;opacity:.7}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--panel2)}
.trow.sel{background:var(--accent-soft)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--pc,var(--p4));display:grid;place-items:center;flex:none;margin-top:1px;color:#fff;background:color-mix(in srgb,var(--pc,var(--p4)) 8%,transparent);transition:.15s}
.chk.p1{--pc:var(--p1)}.chk.p2{--pc:var(--p2)}.chk.p3{--pc:var(--p3)}.chk.p4{--pc:var(--p4)}
.chk svg{width:14px;height:14px;stroke-width:3.2;opacity:0}
.trow.done .chk{background:var(--pc)}
.trow.done .chk svg{opacity:1}
.trow.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmain{min-width:0;flex:1}
.ttitle{font-weight:500;word-break:break-word}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tmeta:empty{display:none}
.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty .big{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
.empty .big svg{width:30px;height:30px}
.more{margin:18px 0 0;color:var(--muted);font-weight:600;font-size:13px;padding:8px 4px;display:flex;gap:6px;align-items:center}
/* detail */
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.titlein{width:100%;border:0;outline:0;background:none;font-size:22px;font-weight:700;letter-spacing:-.02em;padding:4px 0;margin-bottom:6px}
.field{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.field>label{color:var(--muted);font-size:13px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px;outline:0;min-height:40px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);min-height:34px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.p1.on{color:var(--p1)}.seg button.p2.on{color:var(--p2)}.seg button.p3.on{color:var(--p3)}
.subs{margin:10px 0}
.srow{display:flex;gap:10px;align-items:center;padding:4px 0}
.srow .chk{width:22px;height:22px}
.srow input.sin{flex:1;border:0;outline:0;background:none;padding:8px 0;min-width:0}
.srow.done input.sin{text-decoration:line-through;color:var(--muted)}
.srow .x{color:var(--muted);opacity:.6;padding:6px}
.blk{margin-top:18px}
.blk h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
a.btn{text-decoration:none}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.calhead h1{font-size:26px;margin-right:auto;min-width:200px}
.iconb{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--panel);border:1px solid var(--line)}
.iconb:hover{color:var(--text)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cal .dow{background:var(--panel2);padding:8px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.cell{background:var(--panel);min-height:112px;padding:6px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.cal.week .cell{min-height:60vh}
.cell:hover{background:var(--panel2)}
.cell.out{opacity:.45}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .dn{font-size:13px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
.cell.today .dn{background:var(--accent);color:#fff}
.chip{font-size:11.5px;line-height:1.25;padding:3px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal.week .chip{white-space:normal}
.chip.ev{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border-left:3px solid var(--c)}
.chip.tk{background:var(--panel2);border-left:3px solid var(--pc,var(--p4))}
.chip.tk.p1{--pc:var(--p1)}.chip.tk.p2{--pc:var(--p2)}.chip.tk.p3{--pc:var(--p3)}
.chip.tk.done{text-decoration:line-through;opacity:.55}
.chip.mo{background:none;color:var(--muted);padding:0 4px}
.agrow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.agrow .tm{width:52px;color:var(--muted);font-size:13px;font-weight:600;flex:none;padding-top:2px}
.agrow .bar{width:4px;border-radius:4px;background:var(--c);flex:none}
/* notes */
.nsearch{display:flex;gap:8px;margin-bottom:12px}
.nitem{padding:12px 14px;border-radius:12px;cursor:pointer;margin-bottom:4px}
.nitem:hover{background:var(--panel2)}
.nitem.sel{background:var(--accent-soft)}
.nitem b{display:flex;gap:6px;align-items:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem p{margin:3px 0 0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nitem small{color:var(--muted);font-size:11.5px}
.ed-top{padding:14px 28px 0;background:var(--panel);border-bottom:1px solid var(--line)}
.ed-title{width:100%;border:0;outline:0;background:none;font-size:30px;font-weight:800;letter-spacing:-.03em;padding:8px 0}
.ed-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 0 10px}
.ed-meta .inp{width:auto;min-height:34px;padding:5px 10px;font-size:13px}
.tb{display:flex;gap:2px;flex-wrap:wrap;padding:6px 0 8px;align-items:center}
.tb button{min-width:38px;height:38px;border-radius:9px;color:var(--muted);font-weight:700;font-size:14px;display:grid;place-items:center;padding:0 8px}
.tb button:hover{background:var(--panel2);color:var(--text)}
.tb .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.tb .seg{margin-left:auto;flex:none}
.tb .seg button{min-width:0;height:30px;min-height:30px;font-size:12.5px}
.ed-wrap{flex:1;display:flex;min-height:0;position:relative;background:var(--panel)}
.ed-wrap textarea{flex:1;border:0;outline:0;resize:none;background:none;padding:22px 28px 80px;font:15.5px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;min-width:0}
.ed-wrap .pv{flex:1;overflow:auto;padding:22px 28px 80px;min-width:0}
.ed-wrap.split .pv{border-left:1px solid var(--line);background:var(--panel2)}
.ed-foot{border-top:1px solid var(--line);background:var(--panel);padding:12px 28px;display:flex;gap:18px;flex-wrap:wrap;max-height:30%;overflow:auto}
.ed-foot .blk{margin:0;min-width:220px;flex:1}
.lk{display:flex;gap:8px;align-items:center;padding:5px 0;cursor:pointer;color:var(--accent);font-weight:500}
.slash{position:absolute;left:28px;top:12px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:6px;width:240px;max-height:300px;overflow:auto}
.slash button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-weight:500}
.slash button.on,.slash button:hover{background:var(--accent-soft);color:var(--accent)}
.md h1,.md h2,.md h3{letter-spacing:-.02em;margin:1.1em 0 .4em;line-height:1.2}
.md h1{font-size:1.7em}.md h2{font-size:1.35em}.md h3{font-size:1.12em}
.md>:first-child{margin-top:0}
.md p{margin:.5em 0}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.md ul.tl{list-style:none;padding-left:0}
.md ul.tl li{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.md ul.tl input{width:19px;height:19px;margin-top:3px;accent-color:var(--accent)}
.md li.done span{text-decoration:line-through;color:var(--muted)}
.md blockquote{margin:.7em 0;padding:.2em 1em;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.md code{background:var(--panel2);padding:2px 6px;border-radius:6px;font:.9em ui-monospace,Menlo,monospace}
.md pre{background:#12141f;color:#e6e8f5;padding:14px 16px;border-radius:12px;overflow:auto}
.md pre code{background:none;padding:0;color:inherit}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md a{color:var(--accent)}
.md a.wl{background:var(--accent-soft);padding:0 6px;border-radius:6px;text-decoration:none;cursor:pointer;font-weight:500}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(10,12,24,.5);backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);width:min(720px,100%);max-height:92dvh;overflow:auto;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.4);padding:24px 26px 28px}
.modal h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.modal h4{margin:26px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:6px 0}
.code{font:12.5px ui-monospace,Menlo,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-all;margin:6px 0}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--panel);box-shadow:0 0 0 2px transparent}
.sw button.on{box-shadow:0 0 0 2px var(--c)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row2 .inp{flex:1;min-width:140px}
.chkrow{display:flex;gap:10px;align-items:center;padding:6px 0}
.chkrow input{width:20px;height:20px;accent-color:var(--accent)}
.feed{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#1c1f33;color:#fff;padding:11px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-weight:500;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

.main.v-board .col,.main.v-shifts .col{padding:22px 24px}
.main.v-board .col-in,.main.v-shifts .col-in{max-width:none}
[data-drag]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ghost-drag{z-index:90;pointer-events:none;opacity:.92;box-shadow:0 18px 40px rgba(0,0,0,.3);margin:0!important;border-radius:12px;background:var(--panel)}
.dragging{opacity:.35}
.over{outline:2px dashed var(--accent);outline-offset:-3px;background-color:var(--accent-soft)!important}
.board{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:14px;align-items:start;margin-top:8px}
.bcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:260px}
.bcol h3{margin:0 0 10px 4px;font-size:13px;color:var(--muted);display:flex;gap:8px;justify-content:space-between}
.bcards{display:flex;flex-direction:column;gap:8px}
.bcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pc,var(--p4));border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.bcard.p1{--pc:var(--p1)}.bcard.p2{--pc:var(--p2)}.bcard.p3{--pc:var(--p3)}
.bcard.done .ttitle{text-decoration:line-through;color:var(--muted)}
.bempty{color:var(--muted);text-align:center;font-size:13px;padding:24px 0}
.wk{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.wk-row{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr))}
.wk-h{padding:8px 4px;text-align:center;border-left:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;background:var(--panel2)}
.wk-h:first-child{border-left:0}
.wk-h b{display:block;font-size:18px;color:var(--text)}
.wk-h.today b{color:#fff;background:var(--accent);border-radius:50%;width:32px;height:32px;line-height:32px;margin:2px auto 0}
.wk-h.sel{box-shadow:inset 0 -3px 0 var(--accent)}
.wk-ad{border-top:1px solid var(--line);min-height:36px}
.wk-ad>div{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wk-ad>div:first-child{border-left:0;font-size:10px;color:var(--muted);padding:8px 4px}
.wk-body{overflow:auto;max-height:calc(100dvh - 260px);border-top:1px solid var(--line);position:relative}
.wk-grid{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));height:calc(24*var(--hh))}
.wk-t{position:relative}
.wk-t span{position:absolute;right:6px;transform:translateY(-50%);font-size:10px;color:var(--muted)}
.wk-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--line) calc(var(--hh) - 1px),var(--line) var(--hh))}
.wk-col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.wk-blk{position:absolute;border-radius:8px;padding:3px 6px;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer;border-left:3px solid var(--pc,var(--accent));background:var(--panel2);box-shadow:0 1px 3px rgba(0,0,0,.14);min-height:22px}
.wk-blk.ev{background:color-mix(in srgb,var(--c) 18%,var(--panel));color:var(--c);border-left-color:var(--c);cursor:default}
.wk-blk.p1{--pc:var(--p1)}.wk-blk.p2{--pc:var(--p2)}.wk-blk.p3{--pc:var(--p3)}.wk-blk.p4{--pc:var(--p4)}
.wk-blk.done{opacity:.5;text-decoration:line-through}
.wk-now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}

.dnr{display:flex;justify-content:space-between;align-items:flex-start}
.shb{font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--c);color:#fff}

.brush button.on{border-color:var(--c,var(--accent))}
.brush .bk{width:32px;height:32px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.shbig{margin-top:4px;border-radius:10px;padding:8px 6px;text-align:center;font-size:20px;font-weight:800;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.shbig small{display:block;font-size:11px;font-weight:600;opacity:.9}

.nimg{max-width:100%;border-radius:12px}
.tg{width:22px;height:22px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.tg svg{width:16px;height:16px;transition:.15s}.tg.open svg{transform:rotate(90deg)}
.crumb{font-size:13px;color:var(--muted);padding-top:2px}.crumb a{cursor:pointer;color:var(--accent)}
@media (max-width:900px){.board{overflow-x:auto;grid-template-columns:repeat(3,minmax(210px,1fr))}}
/* responsive */
@media (max-width:1180px){
  :root{--side:76px}

  .nav{justify-content:center;padding:11px 0}
  .main:not(.v-notes) .detail.show{position:absolute;right:0;top:0;bottom:0;width:min(430px,100%);z-index:20;box-shadow:-20px 0 50px rgba(0,0,0,.18)}
  .ed-wrap.split{flex-direction:column}.ed-wrap.split .pv{border-left:0;border-top:1px solid var(--line)}
}

}
@media (max-width:640px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr 62px}

<script>
'use strict';
/* ============ Utils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const longDate=s=>pd(s).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
function dlabel(s){const t=today();if(s===t)return'Heute';if(s===addDays(t,1))return'Morgen';if(s===addDays(t,-1))return'Gestern';const d=pd(s);return d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short',...(d.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})})}
const fmtDT=ts=>new Date(ts).toLocaleString('de-DE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(msg){const d=document.createElement('div');d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3200)}
function dl(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('In Zwischenablage kopiert')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('In Zwischenablage kopiert')}catch(_){toast('Kopieren nicht möglich')}ta.remove()}}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title,text})}catch(e){}}else copyText(text)}

/* ============ Icons ============ */

upc:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',

search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 5 5L20 7"/>',

link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',

tag:'<path d="M20 12 12 20a2 2 0 0 1-3 0l-6-6a2 2 0 0 1 0-3L11 3h8a1 1 0 0 1 1 1z"/><circle cx="15" cy="8" r="1"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>',
image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>',
rota:'<path d="M8 2v4M16 2v4M3 8h18"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="m9 15 2 2 4-4"/>',

user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
tpl:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]||''}</svg>`;

/* ============ State ============ */
const GKEY='flux-v1';let KEY=GKEY;try{const lu=localStorage.getItem('flux-last-uid');if(lu)KEY='flux-u-'+lu}catch(e){}
const defaults=()=>({v:1,tasks:[],notes:[],events:[],templates:[],img:{},shifts:{types:[{id:'F',name:'Frühschicht',short:'F',color:'#f59e0b',start:'06:00',end:'14:00'},{id:'S',name:'Spätschicht',short:'S',color:'#3b82f6',start:'14:00',end:'22:00'},{id:'N',name:'Nachtschicht',short:'N',color:'#6366f1',start:'22:00',end:'06:00'},{id:'X',name:'Frei',short:'–',color:'#94a3b8',start:'',end:''},{id:'U',name:'Urlaub',short:'U',color:'#10b981',start:'',end:''}],days:{}},areas:[{id:'privat',name:'Privat',color:'#ec4899'},{id:'beruf',name:'Beruf',color:'#0ea5e9'}],
 set:{theme:'auto',accent:'#6366f1',webhook:'',notify:false,autoGcal:false,hooks:{'task.created':true,'task.completed':true,'task.updated':false,'note.created':true,'note.updated':false},gClient:'',feeds:[]}});
function seed(){const S=defaults(),t=today(),now=Date.now();
 const n1={id:uid(),title:'Willkommen bei Flux 👋',area:null,tags:['start'],pinned:true,created:now,updated:now,body:`# Willkommen bei Flux\n\nAufgaben und Notizen an einem Ort – privat und beruflich.\n\n## So geht's\n- Oben in **Heute** eine Aufgabe schreiben, z. B. \`Zahnarzt morgen 15 Uhr #privat !1\`\n- In Notizen mit **/** am Zeilenanfang Blöcke einfügen (Überschrift, Checkliste, Code …)\n- Notizen verlinken: [[Projektidee]]\n- Zeile in der Notiz markieren und mit dem Aufgaben-Button zur Aufgabe machen\n\n## Checkliste\n- [x] Flux öffnen\n- [ ] Kalender verbinden (Einstellungen → Kalender)\n- [ ] Webhook für Zapier / Make / n8n eintragen\n\n> Tipp: Alles bleibt lokal auf deinem Gerät, bis du es exportierst oder verbindest.`};
 const n2={id:uid(),title:'Projektidee',area:'beruf',tags:[],pinned:false,created:now,updated:now,body:'# Projektidee\n\nHier kommen Gedanken rein.\n\nZurück zu [[Willkommen bei Flux 👋]]'};
 S.notes.push(n1,n2);
 const mk=(title,o)=>Object.assign({id:uid(),title,desc:'',done:false,doneAt:0,due:'',time:'',prio:4,area:null,tags:[],sub:[],repeat:'',noteId:null,calId:'',created:now},o);
 S.tasks.push(mk('Wochenplanung machen',{due:t,time:'09:00',prio:2,area:'beruf',repeat:'weekly'}),
  mk('Einkaufen: Milch, Brot, Obst',{due:t,prio:4,area:'privat',sub:[{id:uid(),t:'Milch',done:false},{id:uid(),t:'Brot',done:true}]}),
  mk('Kundenanruf vorbereiten',{due:addDays(t,1),time:'14:30',prio:1,area:'beruf',noteId:n2.id}),
  mk('Flux ausprobieren',{prio:3}));
 return S}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);const D=defaults();return Object.assign(D,d,{set:{...D.set,...(d.set||{}),hooks:{...D.set.hooks,...((d.set||{}).hooks||{})}}})}}catch(e){}return seed()}
let S=load();
function fixS(){if(!S.shifts||!S.shifts.types)S.shifts=defaults().shifts;if(!S.shifts.days)S.shifts.days={};if(!S.img)S.img={};if(!S.templates)S.templates=[];
S.tasks.forEach(t=>{if(!t.status)t.status='todo';if(t.remind==null)t.remind=''});S.notes.forEach(n=>{if(n.parent===undefined)n.parent=null})}
fixS();
let _st,_qw=0;function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(Date.now()-_qw>10000){_qw=Date.now();toast('Speicher voll – Backup machen, Bilder entfernen')}}}
function save(){S._ts=Date.now();if(typeof fb!=='undefined'&&fb.hold)return;clearTimeout(_st);_st=setTimeout(()=>{persist();if(typeof syncQueue==='function')syncQueue()},250)}
const ui={view:'today',sel:null,calMode:'month',calDate:today(),calSel:today(),nq:'',nmode:innerWidth>1250?'split':'edit',modal:false,doneOpen:false,slash:null,q:'',boardArea:'',shDate:today(),brush:'F',collapsed:{},sheet:null,wkScroll:null,pendingParent:null};
const area=id=>S.areas.find(a=>a.id===id);
const getTask=id=>S.tasks.find(t=>t.id===id);
const getNote=id=>S.notes.find(n=>n.id===id);

/* ============ Hooks (Webhook out) ============ */
function emit(event,data){const u=S.set.webhook;if(!u||!S.set.hooks[event])return;
 try{fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({source:'flux',event,ts:new Date().toISOString(),data})}).catch(()=>{})}catch(e){}}

/* ============ Markdown ============ */
function inline(s){const codes=[];s=esc(s).replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
 s=s.replace(/\[\[([^\]]+)\]\]/g,(_,t)=>`<a class="wl" data-act="wikilink" data-t="${t}">${t}</a>`)
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>')
  .replace(/\[([^\]]+)\]\(((?:https?:|mailto:|tel:)[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
 return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${codes[i]}</code>`)}
function md(src){const L=String(src||'').split('\n'),out=[];let list=null,inCode=false,code=[];
 const close=()=>{if(list){out.push(`</${list.split(' ')[0]}>`);list=null}};
 const open=k=>{if(list!==k){close();out.push(k==='ul tl'?'<ul class="tl">':'<'+k+'>');list=k}};
 for(let n=0;n<L.length;n++){const l=L[n];let m;
  if(/^```/.test(l)){if(inCode){out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=[];inCode=false}else{close();inCode=true}continue}
  if(inCode){code.push(l);continue}
  if(/^\s*\|/.test(l)&&n+1<L.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[n+1])){close();const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const hd=cells(l),rows=[];n+=2;while(n<L.length&&/^\s*\|/.test(L[n])){rows.push(cells(L[n]));n++}n--;
   out.push('<div class="tw"><table><thead><tr>'+hd.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');continue}
  let im;if(im=l.match(/^!\[(.*?)\]\(img:(\w+)\)\s*$/)){close();const u=S.img&&S.img[im[2]];out.push(u?`<p><img class="nimg" src="${u}" alt="${esc(im[1])}"></p>`:'<p><em>[Bild nicht mehr vorhanden]</em></p>');continue}
  if(m=l.match(/^(#{1,3})\s+(.*)/)){close();out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);continue}
  if(/^-{3,}\s*$/.test(l)){close();out.push('<hr>');continue}
  if(m=l.match(/^>\s?(.*)/)){close();out.push(`<blockquote>${inline(m[1])}</blockquote>`);continue}
  if(m=l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/)){open('ul tl');const d=m[1]!==' ';out.push(`<li class="${d?'done':''}"><input type="checkbox" data-line="${n}" ${d?'checked':''}><span>${inline(m[2])}</span></li>`);continue}
  if(m=l.match(/^\s*[-*]\s+(.*)/)){open('ul');out.push(`<li>${inline(m[1])}</li>`);continue}
  if(m=l.match(/^\s*\d+\.\s+(.*)/)){open('ol');out.push(`<li>${inline(m[1])}</li>`);continue}
  if(!l.trim()){close();continue}
  close();out.push(`<p>${inline(l)}</p>`)}
 close();if(inCode)out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');return out.join('')}
const plain=s=>String(s||'').replace(/```[\s\S]*?```/g,' ').replace(/[#>*`~\[\]]/g,'').replace(/^\s*-\s+\(?[ x]?\)?\s*/gm,'').replace(/\s+/g,' ').trim();

/* ============ Quick-add parser ============ */
const WD=['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
function parseQuick(text){let t=' '+text+' ';const o={due:'',time:'',prio:4,area:null,tags:[],repeat:''};
 const take=(re,fn)=>{const m=t.match(re);if(m){if(fn(m)!==false)t=t.replace(re,' ')}};
 take(/\s[!pP]([1-4])(?=\s)/,m=>{o.prio=+m[1]});
 take(/\s#(\S+)(?=\s)/,m=>{const a=S.areas.find(a=>a.id===m[1].toLowerCase()||a.name.toLowerCase()===m[1].toLowerCase());if(!a)return false;o.area=a.id});
 let m;while(m=t.match(/\s@(\S+)(?=\s)/)){o.tags.push(m[1].toLowerCase());t=t.replace(m[0],' ')}
 take(/\s(?:um\s)?(\d{1,2})[:.](\d{2})(?:\s?uhr)?(?=\s)/i,m=>{if(+m[1]>23||+m[2]>59)return false;o.time=pad(+m[1])+':'+m[2]});
 if(!o.time)take(/\s(?:um\s)?(\d{1,2})\s?uhr(?=\s)/i,m=>{if(+m[1]>23)return false;o.time=pad(+m[1])+':00'});
 const td=today();
 take(/\s(täglich|jeden tag)(?=\s)/i,()=>{o.repeat='daily'});take(/\s(wöchentlich|jede woche)(?=\s)/i,()=>{o.repeat='weekly'});
 take(/\s(monatlich|jeden monat)(?=\s)/i,()=>{o.repeat='monthly'});take(/\s(jährlich|jedes jahr)(?=\s)/i,()=>{o.repeat='yearly'});
 take(/\s(übermorgen)(?=\s)/i,()=>{o.due=addDays(td,2)});take(/\s(morgen)(?=\s)/i,()=>{o.due=addDays(td,1)});take(/\s(heute)(?=\s)/i,()=>{o.due=td});

const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');

function gcalLink(t){const e=endOf(t);return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+cmp(t.due,t.time)+'/'+cmp(e.d,e.t)+'&details='+encodeURIComponent((t.desc||'')+'\n\nAus Flux')}
function icsDT(v,p){const allDay=/VALUE=DATE(?!-)/.test(p||'')&&!/DATE-TIME/.test(p||'')||v.length===8;const date=`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;if(!/^\d{8}/.test(v))return null;if(allDay)return{date,time:'',allDay:true};
 if(v.endsWith('Z')){const d=new Date(Date.UTC(+v.slice(0,4),+v.slice(4,6)-1,+v.slice(6,8),+v.slice(9,11),+v.slice(11,13)));return{date:ymd(d),time:pad(d.getHours())+':'+pad(d.getMinutes()),allDay:false}}

function rrule(r,start,lo,hi){if(!r)return start>=lo&&start<=hi?[start]:[];const o={};r.split(';').forEach(p=>{const [k,v]=p.split('=');o[k]=v});
 const iv=+o.INTERVAL||1,cnt=o.COUNT?+o.COUNT:Infinity,until=o.UNTIL?`${o.UNTIL.slice(0,4)}-${o.UNTIL.slice(4,6)}-${o.UNTIL.slice(6,8)}`:'9999';
 const s=pd(start),map={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6},by=o.BYDAY?o.BYDAY.split(',').map(x=>map[x.slice(-2)]):[s.getDay()];
 const res=[];let n=0,d=start,g=0;const monIdx=x=>Math.floor((Math.round((pd(x)-s)/864e5)+((s.getDay()+6)%7))/7);
 while(d<=hi&&d<=until&&n<cnt&&g++<6000){const x=pd(d),diff=Math.round((x-s)/864e5);let ok=false;
  if(o.FREQ==='DAILY')ok=diff%iv===0;else if(o.FREQ==='WEEKLY')ok=by.includes(x.getDay())&&monIdx(d)%iv===0;
  else if(o.FREQ==='MONTHLY')ok=x.getDate()===s.getDate()&&((x.getFullYear()-s.getFullYear())*12+x.getMonth()-s.getMonth())%iv===0;
  else if(o.FREQ==='YEARLY')ok=x.getDate()===s.getDate()&&x.getMonth()===s.getMonth()&&(x.getFullYear()-s.getFullYear())%iv===0;else ok=d===start;
  if(ok){n++;if(d>=lo)res.push(d)}d=addDays(d,1)}return res}
function parseICS(txt,src,color){txt=txt.replace(/\r?\n[ \t]/g,'');const evs=[];let cur=null;

 for(const e of evs){const s=icsDT(e.DTSTART,e.DTSTART_P);if(!s)continue;const en=e.DTEND?icsDT(e.DTEND,e.DTEND_P):null;let endDate=s.date,endTime='';
  if(en){endDate=en.date;endTime=en.time;if(s.allDay&&en.allDay)endDate=addDays(en.date,-1);if(endDate<s.date)endDate=s.date}
  const span=Math.round((pd(endDate)-pd(s.date))/864e5);
  rrule(e.RRULE,s.date,lo,hi).forEach(d=>out.push({id:(e.UID||uid())+'_'+d,title:unesc(e.SUMMARY||'(ohne Titel)'),loc:unesc(e.LOCATION||''),allDay:s.allDay,time:s.time,endTime,date:d,endDate:addDays(d,span),src,color}))}

/* ============ Rendering: calendar ============ */
function monday(s){const d=pd(s);const off=(d.getDay()+6)%7;return addDays(s,-off)}
function calMap(from,to){const m={};const g=d=>m[d]||(m[d]={ev:[],tk:[]});
 S.events.forEach(e=>{let d=e.date;const end=e.allDay?e.endDate:e.date;for(let i=0;i<14&&d<=end;i++){if(d>=from&&d<=to)g(d).ev.push(e);d=addDays(d,1)}});
 S.tasks.forEach(t=>{if(t.due&&t.due>=from&&t.due<=to)g(t.due).tk.push(t)});
 Object.values(m).forEach(x=>x.ev.sort((a,b)=>(a.allDay?'':a.time||'').localeCompare(b.allDay?'':b.time||'')));return m}

function intake(){const raw=location.search.slice(1)||(location.hash.includes('?')?location.hash.split('?')[1]:'');if(!raw)return;const p=new URLSearchParams(raw);let did=false;
 if(p.get('add')){const o=parseQuick(p.get('add'));addTask({title:o.title,due:p.get('due')||o.due,time:p.get('time')||o.time,prio:+p.get('prio')||o.prio,area:p.get('area')||o.area,tags:[...o.tags,...(p.get('tags')||'').split(',').filter(Boolean)],desc:p.get('notes')||''});did='Aufgabe angelegt'}
 else if(p.get('note')){const n=newNote(p.get('note'),p.get('body')||'',p.get('area')||null);ui.view='notes';ui.sel={type:'note',id:n.id};did='Notiz angelegt'}
 else if(p.get('title')||p.get('text')||p.get('url')){addTask({title:p.get('title')||p.get('text')||p.get('url'),desc:[p.get('text'),p.get('url')].filter(Boolean).join('\n')});did='Aus Teilen-Link gespeichert'}
 if(did){history.replaceState(null,'',location.pathname);setTimeout(()=>toast(did),300)}}

function boardCard(t){const a=area(t.area),late=t.due&&t.due<today()&&!t.done;const sd=t.sub.length?`${t.sub.filter(s=>s.done).length}/${t.sub.length}`:'';
 return `<div class="bcard p${t.prio} ${t.done?'done':''}" data-act="open-task" data-id="${t.id}" data-drag="task"><div class="ttitle">${esc(t.title)}</div><div class="tmeta">${t.due?`<span class="pill ${late?'late':'mute'}">${ic('cal')}${esc(dlabel(t.due))}${t.time?' · '+t.time:''}</span>`:''}${a?`<span class="pill area" style="--c:${a.color}">${esc(a.name)}</span>`:''}${sd?`<span class="pill mute">${ic('list')}${sd}</span>`:''}</div></div>`}
function boardHTML(){const f=ui.boardArea,base=S.tasks.filter(t=>!f||t.area===f);
 const cols=[['todo','Offen',base.filter(t=>!t.done&&(t.status||'todo')==='todo').sort((a,b)=>a.prio-b.prio||b.created-a.created)],['doing','In Arbeit',base.filter(t=>!t.done&&t.status==='doing').sort((a,b)=>a.prio-b.prio||b.created-a.created)],['done','Erledigt',base.filter(t=>t.done).sort((a,b)=>b.doneAt-a.doneAt).slice(0,20)]];
 const chips=[['','Alle'],...S.areas.map(a=>[a.id,a.name])];
 return `<div class="col-in"><div class="head"><div><h1>Board</h1><p class="sub">Karte gedrückt halten und in eine Spalte ziehen</p></div><div class="seg" style="min-width:240px">${chips.map(([v,l])=>`<button class="${f===v?'on':''}" data-act="board-area" data-v="${v}">${esc(l)}</button>`).join('')}</div></div>${qaForm()}

let drag=null,suppressClick=0;
function startDrag(){const d=drag,r=d.el.getBoundingClientRect();d.ox=d.x-r.left;d.oy=d.y-r.top;

 const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  let url=c.toDataURL('image/jpeg',0.8);for(const q of [0.65,0.5,0.4])if(url.length>900000)url=c.toDataURL('image/jpeg',q);const id=uid();S.img[id]=url;const name=(file.name||'Bild').replace(/\.[^.]+$/,'').replace(/[\[\]()]/g,'');
  const t=$('#nbody');if(t){t.setRangeText(`\n![${name}](img:${id})\n`,t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input',{bubbles:true}))}save();toast('Bild eingefügt ('+Math.round(url.length/1024)+' KB)')};im.onerror=()=>toast('Bild konnte nicht gelesen werden');im.src=fr.result};fr.readAsDataURL(file)}

/* ---- Diktat ---- */
let rec=null;
function setMic(on){document.querySelectorAll('[data-act=dictate]').forEach(b=>b.classList.toggle('rec',on))}
function dictate(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Spracheingabe wird von diesem Browser nicht unterstützt');return}
 if(rec){rec.stop();return}if(target==='note'&&!$('#nbody')){toast('Wechsle zu „Schreiben“ oder „Geteilt“');return}
 rec=new SR();rec.lang='de-DE';rec.interimResults=false;rec.continuous=target==='note';
 rec.onresult=e=>{let txt='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)txt+=e.results[i][0].transcript;txt=txt.trim();if(!txt)return;
  if(target==='note'){const ta=$('#nbody');if(ta){ta.setRangeText(txt+' ',ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input',{bubbles:true}))}}
  else{const i=$('#qai');if(i){i.value=(i.value?i.value+' ':'')+txt;i.dispatchEvent(new Event('input',{bubbles:true}));i.focus()}}};
 rec.onend=()=>{rec=null;setMic(false)};rec.onerror=ev=>{if(ev.error!=='no-speech'&&ev.error!=='aborted')toast('Spracheingabe: '+ev.error)};
 try{rec.start();setMic(true)}catch(e){rec=null}}

/* ---- Erinnerungen ---- */
function remindFire(t){if(t.done||!t.due||t.remind===''||t.remind==null)return null;const [h,m]=(t.time||'09:00').split(':').map(Number),d=pd(t.due);d.setHours(h,m,0,0);return d.getTime()-(+t.remind)*60000}
function notifyTask(t){const body=(t.time?t.time+' Uhr · ':'')+dlabel(t.due);toast('⏰ '+t.title);
 if(!('Notification' in window)||Notification.permission!=='granted')return;
 const plain=()=>{try{new Notification(t.title,{body,icon:'icons/icon-192.png',tag:t.id})}catch(e){}};
 if(navigator.serviceWorker)navigator.serviceWorker.getRegistration().then(r=>r?r.showNotification(t.title,{body,icon:'icons/icon-192.png',tag:t.id}):plain()).catch(plain);else plain()}
function checkReminders(){if(!S.set.notify)return;const now=Date.now();let ch=false;
 S.tasks.forEach(t=>{const f=remindFire(t);if(f==null)return;const key=t.due+'|'+(t.time||'')+'|'+t.remind;if(now>=f&&now-f<6*3600e3&&t.remFired!==key){t.remFired=key;ch=true;notifyTask(t)}});if(ch)save()}
function autoFeeds(){S.set.feeds.filter(f=>f.url).forEach(f=>refreshFeed(f).then(()=>{if(viewType()==='cal')renderCol()}).catch(()=>{}))}
async function fetchICS(url){url=url.replace(/^webcal:/i,'https:');
 try{const r=await fetch('api/ics?url='+encodeURIComponent(url));if(r.ok&&/calendar/.test(r.headers.get('content-type')||''))return r.text()}catch(e){}
 const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}

/* ============ Konto & Sync (Firebase Auth + Firestore) ============ */
var fb={user:null,state:'off',msg:'',hold:false,ready:false,pushT:null,unM:null,unI:null,remoteImg:null,known:new Set(),last:null,busy:false};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const mainJSON=()=>{const o={...S};delete o.img;return JSON.stringify(o)};
function fbStatusText(){return fb.state==='err'?(fb.msg||'Fehler'):fb.state==='sync'?'synchronisiere …':fb.state==='ok'?'synchronisiert':'verbinde …'}
function fbErr(e){const c=(e&&e.code)||'';const m={
 'auth/popup-blocked':'Popup wurde blockiert – bitte Popups für die Seite erlauben.','auth/popup-closed-by-user':'Anmeldung abgebrochen.','auth/cancelled-popup-request':'Anmeldung abgebrochen.',
 'auth/unauthorized-domain':'Domain nicht autorisiert: in Firebase unter Authentication → Einstellungen → Autorisierte Domains eintragen.','auth/operation-not-allowed':'Diese Anmeldemethode ist in Firebase noch nicht aktiviert (Authentication → Anmeldemethode).',
 'auth/invalid-credential':'E-Mail oder Passwort falsch.','auth/wrong-password':'E-Mail oder Passwort falsch.','auth/user-not-found':'E-Mail oder Passwort falsch.','auth/invalid-email':'Ungültige E-Mail-Adresse.',
 'auth/email-already-in-use':'Diese E-Mail ist schon registriert – bitte anmelden.','auth/weak-password':'Passwort zu schwach (mindestens 6 Zeichen).','auth/network-request-failed':'Keine Verbindung.','auth/too-many-requests':'Zu viele Versuche – bitte kurz warten.',
 'permission-denied':'Keine Berechtigung: Firestore-Regeln prüfen (Regeln veröffentlicht?).','unavailable':'Server nicht erreichbar.','failed-precondition':'Firestore-Datenbank fehlt (in Firebase anlegen).'}[c];
 return m||('Fehler: '+(c||(e&&e.message)||e))}
function statusUI(){renderSide();if(ui.sheet===acctSheet)sheet(acctSheet);else if(ui.modal&&!ui.sheet)refreshModal()}
function acctSheet(){
 if(!window.FBX)return sheetHead('Konto & Sync')+'<p class="hint">Die Anmeldung konnte nicht geladen werden (offline?). Die App funktioniert weiter lokal.</p>';
 if(fb.user){const u=fb.user;return sheetHead('Konto & Sync')+`<p><b>${esc(u.displayName||'Angemeldet')}</b><br><span class="hint">${esc(u.email||'')}</span></p>
  <p class="hint">Status: ${esc(fbStatusText())}<br>Deine Aufgaben, Notizen, Dienstplan und Bilder werden mit deinem Konto synchronisiert und sind nur für dich sichtbar.</p>
  <div class="row2"><button class="btn sec2 sm" data-act="fb-now">${ic('sync')} Jetzt synchronisieren</button><button class="btn danger sm" data-act="fb-logout">Abmelden</button></div>`}
 return sheetHead('Anmelden')+`<p class="hint">Mit eigenem Konto sind deine Daten getrennt von anderen Nutzern und auf allen Geräten gleich.</p>
  <div class="row2"><button class="btn sm" data-act="g-login" ${fb.busy?'disabled':''}>Mit Google anmelden</button></div>
  <p class="hint" style="margin:14px 0 6px">oder mit E-Mail und Passwort:</p>
  <input class="inp" id="fbMail" type="email" autocomplete="email" placeholder="E-Mail" style="margin-bottom:8px">
  <input class="inp" id="fbPass" type="password" autocomplete="current-password" placeholder="Passwort (mind. 6 Zeichen)">
  <div class="row2" style="margin-top:10px"><button class="btn sm" data-act="m-login" ${fb.busy?'disabled':''}>Anmelden</button><button class="btn sec2 sm" data-act="m-reg" ${fb.busy?'disabled':''}>Neu registrieren</button><button class="btn sec2 sm" data-act="m-reset">Passwort vergessen</button></div>
  ${fb.msg?`<p class="hint" style="color:#ef4444;margin-top:10px">${esc(fb.msg)}</p>`:''}`}
async function fbDo(fn){fb.busy=true;fb.msg='';if(ui.sheet===acctSheet)sheet(acctSheet);try{await fn()}catch(e){fb.msg=fbErr(e)}fb.busy=false;if(ui.sheet===acctSheet)sheet(acctSheet)}
function mailAuth(reg){const m=($('#fbMail')||{}).value||'',p=($('#fbPass')||{}).value||'';if(!m||!p){fb.msg='Bitte E-Mail und Passwort eintragen.';sheet(acctSheet);return}fbDo(()=>reg?FBX.register(m.trim(),p):FBX.login(m.trim(),p))}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='fbPass')mailAuth(false)});

/* --- lokale Daten ↔ Cloud --- */
function blankS(){const D=defaults();D.tasks=[];D.notes=[];return D}
function mergeS(l,r){const o=JSON.parse(JSON.stringify(r));['tasks','notes','events','templates'].forEach(k=>{o[k]=o[k]||[];const ids=new Set(o[k].map(x=>x.id));(l[k]||[]).forEach(x=>{if(!ids.has(x.id))o[k].push(x)})});
 o.shifts=o.shifts||defaults().shifts;o.shifts.days={...((l.shifts||{}).days||{}),...(o.shifts.days||{})};return o}
function adopt(d,ts){const D=defaults(),keep={theme:S.set.theme,notify:S.set.notify},img=S.img;
 S=Object.assign(D,d,{set:{...D.set,...(d.set||{}),hooks:{...D.set.hooks,...((d.set||{}).hooks||{})},...keep}});S.img=img;S._ts=ts;fixS();persist();applyTheme();
 if(ui.sel&&!getTask(ui.sel)&&!getNote(ui.sel))ui.sel=null;paint()}
function adoptSafe(d,ts){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&!ui.modal){setTimeout(()=>{if(fb.user&&ts>(S._ts||0))adoptSafe(d,ts)},2500);return}adopt(d,ts)}
function parseMain(d){try{return JSON.parse(d.json)}catch(e){return null}}
function claimGuest(){lsSet('flux-claimed','1');if(KEY!==GKEY)lsDel(GKEY)}
function takeGuest(){if(lsGet('flux-claimed'))return null;const r=lsGet(GKEY);if(!r)return null;try{const g=JSON.parse(r);return (g.tasks&&g.notes&&(g.tasks.length||g.notes.length))?g:null}catch(e){return null}}
function onMain(data,meta){
 if(!fb.user||meta.fromCache)return;
 if(!fb.ready){
  const guest=fb.hold?takeGuest():null;
  if(!data){ // neues Konto ohne Cloud-Daten
   if(fb.hold){const img=S.img;S=guest?Object.assign(defaults(),guest):seed();S.img=Object.assign({},img,(guest&&guest.img)||{});fixS();if(guest)claimGuest();else lsSet('flux-claimed','1');fb.hold=false;applyTheme();paint()}
   fb.ready=true;S._ts=Date.now();persist();pushMain();reconcileImg();return}
  const r=parseMain(data);if(!r){fb.state='err';fb.msg='Cloud-Daten unlesbar';statusUI();return}
  fb.ready=true;
  if(fb.hold){ // erstes Mal auf diesem Gerät
   const img=S.img;
   if(guest&&confirm('Auf diesem Gerät liegen lokale Daten. Mit deinem Konto zusammenführen?\n\nOK = zusammenführen\nAbbrechen = nur Konto-Daten verwenden')){
    S=mergeS(guest,r);S.img=Object.assign({},img,guest.img||{});fixS();fb.hold=false;claimGuest();S._ts=Date.now();persist();applyTheme();paint();pushMain();reconcileImg();return}
   if(guest||!lsGet('flux-claimed'))lsSet('flux-claimed','1');
   fb.hold=false;S=Object.assign(defaults(),r);S.img=img;S._ts=data.ts||0;fixS();persist();applyTheme();paint();fb.state='ok';statusUI();reconcileImg();return}
  const ts=data.ts||0,lt=S._ts||0;if(ts>lt)adoptSafe(r,ts);else if(ts<lt)pushMain();else{fb.state='ok';statusUI()}reconcileImg();return}
 if(!data||meta.hasPendingWrites)return;
 const r=parseMain(data);if(!r)return;const ts=data.ts||0;if(ts>(S._ts||0))adoptSafe(r,ts);else if(fb.state!=='err'&&!fb.pushT){fb.state='ok';statusUI()}
}
function syncQueue(){if(!fb.user||!fb.ready)return;clearTimeout(fb.pushT);fb.state='sync';statusUI();fb.pushT=setTimeout(pushMain,1200);reconcileImg()}
async function pushMain(){const u=fb.user;if(!u)return;fb.pushT=null;const json=mainJSON();
 if(json.length>950000){fb.state='err';fb.msg='Daten zu groß für den Sync (ohne Bilder über 950 KB).';statusUI();return}
 fb.state='sync';statusUI();
 try{await FBX.putMain(u.uid,{json,ts:S._ts||Date.now()});if(fb.user===u&&!fb.pushT){fb.state='ok';fb.msg='';statusUI()}}catch(e){if(fb.user===u){fb.state='err';fb.msg=fbErr(e);statusUI()}}}
function onImg(list,meta){if(!fb.user||meta.fromCache)return;fb.remoteImg=new Map(list.map(x=>[x.id,x.d]));reconcileImg()}
function reconcileImg(){const u=fb.user;if(!u||!fb.remoteImg)return;const rem=fb.remoteImg;let ch=false;const up=new Set();
 rem.forEach((d,id)=>{if(!S.img[id]){if(fb.known.has(id)){FBX.delImg(u.uid,id).catch(()=>{})}else{S.img[id]=d;ch=true}}});
 Object.keys(S.img).forEach(id=>{if(!rem.has(id)){if(fb.known.has(id)){delete S.img[id];ch=true}else if(S.img[id].length<1000000){up.add(id);FBX.putImg(u.uid,id,S.img[id]).catch(e=>{fb.state='err';fb.msg=fbErr(e);statusUI()})}}});
 fb.known=new Set(Object.keys(S.img).filter(id=>rem.has(id)||up.has(id)));lsSet('flux-known-'+u.uid,JSON.stringify([...fb.known]));
 if(ch){if(!fb.hold)persist();if(!fb.hold&&viewType()==='notes')renderDetail()}}
function enter(u){
 fb.user=u;fb.ready=false;fb.remoteImg=null;fb.state='sync';fb.msg='';
 try{fb.known=new Set(JSON.parse(lsGet('flux-known-'+u.uid)||'[]'))}catch(e){fb.known=new Set()}
 const nk='flux-u-'+u.uid;KEY=nk;lsSet('flux-last-uid',u.uid);
 if(lsGet(nk)){S=load();fixS();fb.hold=false}else{S=blankS();fixS();fb.hold=true}
 applyTheme();ui.sel=null;paint();
 fb.unM=FBX.watchMain(u.uid,onMain,e=>{fb.state='err';fb.msg=fbErr(e);statusUI()});
 fb.unI=FBX.watchImg(u.uid,onImg,e=>{fb.state='err';fb.msg=fbErr(e);statusUI()})}
function leave(){
 if(fb.unM)fb.unM();if(fb.unI)fb.unI();fb.unM=fb.unI=null;clearTimeout(fb.pushT);fb.pushT=null;
 fb.user=null;fb.ready=false;fb.hold=false;fb.remoteImg=null;fb.state='off';lsDel('flux-last-uid');KEY=GKEY;S=load();fixS();applyTheme();ui.sel=null;paint()}
function fbBoot(){const go=()=>{FBX.onUser(u=>{const had=!!fb.user;
  if(u){if(fb.user&&fb.user.uid===u.uid){fb.user=u;return}
   enter(u);if(ui.sheet===acctSheet){closeModal();toast('Angemeldet')}}
  else if(had||KEY!==GKEY){leave();if(had)toast('Abgemeldet')}
  })};
 if(window.FBX)go();else addEventListener('fbx-ready',go,{once:true})}

/* ============ Init ============ */
applyTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
intake();paint();fbBoot();
setInterval(checkReminders,30000);setTimeout(checkReminders,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});autoFeeds();setInterval(autoFeeds,900000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.addEventListener('resize',()=>{if(viewType()==='notes')renderDetail()});
</script>
