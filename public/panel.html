<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1114">
<title>HA Wandpanel</title>
<style>
:root{--am:#ffb400;--or:#ff6a1a;--mt:#8a8f98;--tx:#ece9e1;--bg:#0f1114;--ok:#4ade80;--er:#f43f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{height:100dvh;display:flex;flex-direction:column;padding:14px;gap:12px}
.panel{position:relative;background:linear-gradient(180deg,#252930,#1b1e23);border:1px solid #333840;border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 16px rgba(0,0,0,.4)}
.panel::before,.panel::after{content:'';position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7b818b,#2b2f36)}
.panel::before{left:8px}.panel::after{right:8px}
.top{display:flex;align-items:center;gap:18px;padding:12px 24px;flex:none}
.clock{font:700 clamp(44px,8vw,78px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--am);text-shadow:0 0 22px rgba(255,180,0,.35);font-variant-numeric:tabular-nums}
.meta{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.meta b{font-size:19px}
.st{font:600 11px ui-monospace,monospace;letter-spacing:.14em;color:var(--mt);display:flex;align-items:center;gap:7px}
.led{width:9px;height:9px;border-radius:50%;background:#555b64;display:inline-block}
.led.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.led.sy{background:var(--am);box-shadow:0 0 8px var(--am)}.led.er{background:var(--er);box-shadow:0 0 8px var(--er)}
.tools{display:flex;gap:8px}
.tb{width:48px;height:48px;border-radius:10px;background:#2b3037;border:1px solid #3a4048;display:grid;place-items:center;font-size:20px}
.tb:active,.tb.on{background:#343a42}.tb.on{border-color:var(--am);color:var(--am)}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:minmax(150px,auto);gap:12px;align-content:start;padding:2px;overscroll-behavior:contain}
.tile{padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile h5{margin:0;font:600 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mt);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
.tile .val{font:700 40px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;color:var(--tx)}
.tile .val small{font-size:16px;color:var(--mt);margin-left:4px}
.tile .sub{text-align:center;color:var(--mt);font-size:13px}
.tile.act .val,.tile.act .ico{color:var(--am);text-shadow:0 0 16px rgba(255,180,0,.4)}
.tile.off{opacity:.55}
.ico{font-size:34px;text-align:center}
.big{flex:1;border-radius:12px;background:#15181c;border:1px solid #2d3238;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:80px}
.big:active{background:#20242a}
.tile.act .big{border-color:var(--am);box-shadow:0 0 14px rgba(255,180,0,.25) inset}
.row{display:flex;gap:8px;align-items:stretch;flex:1}
.row button{flex:1;border-radius:12px;background:#15181c;border:1px solid #2d3238;font-size:24px;min-height:64px}
.row button:active{background:#20242a;border-color:var(--am)}
input[type=range]{width:100%;accent-color:var(--am);height:28px}
.edit{position:absolute;inset:auto 6px 6px 6px;display:none;gap:6px;justify-content:center}
.editing .edit{display:flex}
.edit button{width:44px;height:36px;border-radius:8px;background:#2b3037;border:1px solid #3a4048}
.edit .x{color:var(--er)}
.add{display:none;border:2px dashed #3a4048;background:none;box-shadow:none;color:var(--mt);font-size:36px;align-items:center;justify-content:center;min-height:150px;border-radius:14px}
.editing .add{display:flex}
.empty{grid-column:1/-1;text-align:center;color:var(--mt);padding:60px 20px;font-size:18px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.on{display:flex}
.box{width:min(640px,100%);max-height:90dvh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font:600 13px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--am)}
.box label{font-size:13px;color:var(--mt);display:flex;flex-direction:column;gap:5px}
.box input[type=text],.box input[type=password],.box input[type=url],.box input[type=search]{background:#15181c;border:1px solid #2d3238;border-radius:10px;padding:12px;user-select:text}
.btn{background:var(--am);color:#1a1300;border-radius:10px;padding:12px 18px;font-weight:700}
.btn.sec{background:#2b3037;color:var(--tx);border:1px solid #3a4048;font-weight:500}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mt)}
.err{color:var(--er);font-size:14px;min-height:20px}
.list{display:flex;flex-direction:column;gap:6px;max-height:50dvh;overflow:auto}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#15181c;border:1px solid #2d3238;text-align:left;width:100%}
.it.sel{border-color:var(--am)}
.it b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{color:var(--mt);display:block;font-size:12px}
.it .chk{margin-left:auto;color:var(--am);font-size:20px}
.dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:10}
@media (max-width:640px){.top{padding:10px 16px;gap:10px;flex-wrap:wrap}.meta{min-width:120px}}
</style>
</head>
<body>
<div id="app">
  <header class="panel top">
    <div class="clock" id="clock">--:--</div>
    <div class="meta"><b id="greet"></b><span class="st"><i class="led" id="led"></i><span id="stx">OFFLINE</span></span></div>
    <div class="tools">
      <button class="tb" id="bEdit" aria-label="Kacheln bearbeiten">✎</button>
      <button class="tb" id="bFs" aria-label="Vollbild">⛶</button>
      <button class="tb" id="bSet" aria-label="Einstellungen">⚙</button>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<div class="ov" id="ovSet"><div class="panel box">
  <h3>Verbindung</h3>
  <label>Home-Assistant-Adresse<input type="url" id="cUrl" placeholder="http://homeassistant.local:8123  (oder: demo)" autocapitalize="off" autocomplete="off"></label>
  <label>Langlebiges Zugangs-Token<input type="password" id="cTok" placeholder="In Home Assistant: Profil → Sicherheit → Langlebige Zugangs-Tokens" autocapitalize="off" autocomplete="off"></label>
  <label>Bildschirm nachts abdunkeln (Uhrzeit von – bis, leer = aus)
    <span style="display:flex;gap:8px"><input type="text" id="cDimA" placeholder="22:00" style="flex:1"><input type="text" id="cDimB" placeholder="06:00" style="flex:1"></span></label>
  <div class="err" id="cErr"></div>
  <div class="hint">Die Daten bleiben nur auf diesem Tablet gespeichert.</div>
  <div class="btns"><button class="btn sec" id="cClose">Schließen</button><button class="btn" id="cSave">Verbinden</button></div>
</div></div>

<div class="ov" id="ovPick"><div class="panel box">
  <h3>Kachel hinzufügen</h3>
  <input type="search" id="pQ" placeholder="Suchen … z. B. Wohnzimmer, Licht, Rolladen" autocomplete="off">
  <div class="list" id="pList"></div>
  <div class="btns"><button class="btn" id="pDone">Fertig</button></div>
</div></div>
<div class="dim" id="dim"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cfg=Object.assign({url:'',token:'',dimA:'',dimB:'',tiles:[]},JSON.parse(ls.get('hap-cfg')||'{}'));
if(!cfg.url&&/^https?:/.test(location.protocol)&&/\/local\//.test(location.pathname))cfg.url=location.origin;
const saveCfg=()=>ls.set('hap-cfg',JSON.stringify(cfg));
let states={},ws=null,wsId=0,backoff=1000,timer=null,editing=false,pending={},status='off';

/* ---------- Verbindung ---------- */
function setStatus(s,t){status=s;$('#led').className='led '+(s==='ok'?'ok':s==='sy'?'sy':s==='er'?'er':'');$('#stx').textContent=t}
function wsUrl(){let u=cfg.url.trim().replace(/\/+$/,'');if(!/^https?:\/\//.test(u))u='http://'+u;return u.replace(/^http/,'ws')+'/api/websocket'}
const DEMO=[
 {entity_id:'light.wohnzimmer',state:'on',attributes:{friendly_name:'Wohnzimmer Decke',brightness:128}},
 {entity_id:'light.flur',state:'off',attributes:{friendly_name:'Flur',brightness:200}},
 {entity_id:'switch.kaffee',state:'off',attributes:{friendly_name:'Kaffeemaschine'}},
 {entity_id:'cover.wz_rolladen',state:'open',attributes:{friendly_name:'Wohnzimmer Rolladen',current_position:70}},
 {entity_id:'climate.bad',state:'heat',attributes:{friendly_name:'Bad Heizung',temperature:21,current_temperature:19.5}},
 {entity_id:'sensor.balkon_leistung',state:'312.4',attributes:{friendly_name:'Balkonkraftwerk',unit_of_measurement:'W'}},
 {entity_id:'sensor.temp_aussen',state:'11.8',attributes:{friendly_name:'Außentemperatur',unit_of_measurement:'°C'}},
 {entity_id:'scene.abend',state:'unknown',attributes:{friendly_name:'Abend'}}];
let demo=false;
function demoCall(d,sv,data){const s=states[data.entity_id];if(!s)return;const a=s.attributes;
  if(sv==='toggle')s.state=s.state==='on'?'off':'on';
  else if(sv==='turn_on'&&data.brightness_pct){s.state='on';a.brightness=Math.round(data.brightness_pct*2.55)}
  else if(sv==='open_cover'){a.current_position=100;s.state='open'}else if(sv==='close_cover'){a.current_position=0;s.state='closed'}
  else if(sv==='set_temperature')a.temperature=data.temperature;
  render()}
function connect(){
  clearTimeout(timer);demo=false;
  if(cfg.url.trim().toLowerCase()==='demo'){if(ws){try{ws.onclose=null;ws.close()}catch(e){}ws=null}
    demo=true;states={};JSON.parse(JSON.stringify(DEMO)).forEach(s=>states[s.entity_id]=s);setStatus('ok','DEMO-MODUS');if(!cfg.tiles.length)cfg.tiles=DEMO.slice(0,6).map(s=>s.entity_id);render();return}if(ws){try{ws.onclose=null;ws.close()}catch(e){}ws=null}
  if(!cfg.url||!cfg.token){setStatus('off','NICHT EINGERICHTET');return}
  setStatus('sy','VERBINDE …');
  let w;try{w=new WebSocket(wsUrl())}catch(e){setStatus('er','ADRESSE UNGÜLTIG');return}
  ws=w;wsId=0;pending={};
  w.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==='auth_required'){w.send(JSON.stringify({type:'auth',access_token:cfg.token}))}
    else if(m.type==='auth_invalid'){setStatus('er','TOKEN UNGÜLTIG');w.onclose=null;w.close();$('#cErr').textContent='Das Token wurde abgelehnt.';openSet()}
    else if(m.type==='auth_ok'){backoff=1000;setStatus('ok','VERBUNDEN');
      send({type:'get_states'},r=>{if(r.success){states={};r.result.forEach(s=>states[s.entity_id]=s);render()}});
      send({type:'subscribe_events',event_type:'state_changed'})}
    else if(m.type==='result'){const f=pending[m.id];if(f){delete pending[m.id];f(m)}}
    else if(m.type==='event'&&m.event&&m.event.event_type==='state_changed'){const d=m.event.data;
      if(d.new_state)states[d.entity_id]=d.new_state;else delete states[d.entity_id];
      if(cfg.tiles.includes(d.entity_id))render()}};
  w.onclose=()=>{setStatus('er','GETRENNT – NEUER VERSUCH …');timer=setTimeout(connect,backoff);backoff=Math.min(backoff*1.7,30000)};
  w.onerror=()=>{};
}
function send(o,cb){if(!ws||ws.readyState!==1)return;o.id=++wsId;if(cb)pending[o.id]=cb;ws.send(JSON.stringify(o))}
function call(domain,service,data){if(demo)return demoCall(domain,service,data);send({type:'call_service',domain,service,service_data:data})}

/* ---------- Kacheln ---------- */
const dom=id=>id.split('.')[0];
const DOMS=['light','switch','input_boolean','fan','cover','climate','sensor','binary_sensor','scene','script','button','weather','automation','lock','media_player'];
const ICON={light:'💡',switch:'🔌',input_boolean:'🔘',fan:'🌀',cover:'🪟',climate:'🌡️',sensor:'📟',binary_sensor:'🔎',scene:'🎬',script:'▶️',button:'⏺',weather:'⛅',automation:'⚙️',lock:'🔒',media_player:'🎵'};
const name=s=>(s.attributes&&s.attributes.friendly_name)||s.entity_id;
const unit=s=>s.attributes&&s.attributes.unit_of_measurement||'';
const SD={on:'AN',off:'AUS',open:'OFFEN',closed:'ZU',opening:'ÖFFNET',closing:'SCHLIESST',unavailable:'NICHT ERREICHBAR',unknown:'?',locked:'ZU',unlocked:'OFFEN',playing:'SPIELT',paused:'PAUSE',idle:'BEREIT',heat:'HEIZEN',cool:'KÜHLEN',auto:'AUTO'};
const sd=v=>SD[v]||v;
function tileHTML(id,i){
  const s=states[id],d=dom(id);
  if(!s)return `<div class="panel tile off"><h5>${esc(id)}</h5><div class="sub">nicht gefunden</div>${editHTML(i)}</div>`;
  const on=s.state==='on'||s.state==='open'||s.state==='unlocked'||s.state==='playing'||(d==='climate'&&s.state!=='off');
  const a=s.attributes||{},un=s.state==='unavailable';
  let body='';
  if(['light','switch','input_boolean','fan','automation'].includes(d)){
    body=`<button class="big" data-t="toggle" data-id="${esc(id)}"><span class="ico">${ICON[d]}</span><b>${sd(s.state)}</b></button>`;
    if(d==='light'&&a.brightness!=null&&on)body+=`<input type="range" min="1" max="100" value="${Math.round(a.brightness/2.55)}" data-t="bri" data-id="${esc(id)}">`}
  else if(d==='cover'){const p=a.current_position;
    body=`<div class="val">${p!=null?p+'<small>%</small>':sd(s.state)}</div><div class="row"><button data-t="cover" data-s="open_cover" data-id="${esc(id)}">▲</button><button data-t="cover" data-s="stop_cover" data-id="${esc(id)}">■</button><button data-t="cover" data-s="close_cover" data-id="${esc(id)}">▼</button></div>`}
  else if(d==='climate'){const t=a.temperature,c=a.current_temperature;
    body=`<div class="val">${c!=null?c+'<small>°C</small>':'–'}</div><div class="sub">Soll ${t!=null?t+' °C':'–'} · ${sd(s.state)}</div><div class="row"><button data-t="temp" data-d="-0.5" data-id="${esc(id)}">−</button><button data-t="temp" data-d="0.5" data-id="${esc(id)}">+</button></div>`}
  else if(['scene','script','button'].includes(d)){
    body=`<button class="big" data-t="press" data-id="${esc(id)}"><span class="ico">${ICON[d]}</span><b>AUSLÖSEN</b></button>`}
  else if(d==='lock'){body=`<button class="big" data-t="lock" data-id="${esc(id)}"><span class="ico">🔒</span><b>${sd(s.state)}</b></button>`}
  else if(d==='weather'){body=`<div class="val">${a.temperature!=null?a.temperature+'<small>°C</small>':'–'}</div><div class="sub">${esc(s.state)}</div>`}
  else if(d==='media_player'){body=`<div class="val" style="font-size:22px">${esc(a.media_title||sd(s.state))}</div><div class="row"><button data-t="mp" data-s="media_play_pause" data-id="${esc(id)}">⏯</button><button data-t="mp" data-s="media_next_track" data-id="${esc(id)}">⏭</button></div>`}
  else{const num=!isNaN(parseFloat(s.state));
    body=`<div class="val">${esc(num?(+parseFloat(s.state).toFixed(1)):sd(s.state))}<small>${esc(unit(s))}</small></div>`}
  return `<div class="panel tile ${on?'act':''} ${un?'off':''}"><h5>${esc(name(s))}</h5>${body}${editHTML(i)}</div>`}
const editHTML=i=>`<div class="edit"><button data-t="mv" data-d="-1" data-i="${i}">◀</button><button class="x" data-t="rm" data-i="${i}">✕</button><button data-t="mv" data-d="1" data-i="${i}">▶</button></div>`;
function render(){
  const g=$('#grid');if(g.contains(document.activeElement)&&document.activeElement.type==='range')return;
  g.className='grid'+(editing?' editing':'');
  document.body.classList.toggle('editing',editing);g.classList.toggle('editing',editing);
  let h=cfg.tiles.map(tileHTML).join('');
  if(!cfg.tiles.length&&!editing)h=`<div class="empty">Noch keine Kacheln.<br>Tippe oben auf ✎ und dann auf +.</div>`;
  h+=`<button class="add" data-t="add">+</button>`;
  g.innerHTML=h;$('#bEdit').classList.toggle('on',editing)}

$('#grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-t]');if(!b)return;const id=b.dataset.id,t=b.dataset.t;
  if(t==='toggle')call('homeassistant','toggle',{entity_id:id});
  else if(t==='press'){const d=dom(id);call(d,d==='button'?'press':'turn_on',{entity_id:id})}
  else if(t==='cover')call('cover',b.dataset.s,{entity_id:id});
  else if(t==='mp')call('media_player',b.dataset.s,{entity_id:id});
  else if(t==='lock')call('lock',states[id]&&states[id].state==='locked'?'unlock':'lock',{entity_id:id});
  else if(t==='temp'){const s=states[id],cur=s&&s.attributes.temperature;if(cur!=null)call('climate','set_temperature',{entity_id:id,temperature:+(cur+parseFloat(b.dataset.d)).toFixed(1)})}
  else if(t==='add')openPick();
  else if(t==='rm'){cfg.tiles.splice(+b.dataset.i,1);saveCfg();render()}
  else if(t==='mv'){const i=+b.dataset.i,j=i+parseInt(b.dataset.d);if(j>=0&&j<cfg.tiles.length){[cfg.tiles[i],cfg.tiles[j]]=[cfg.tiles[j],cfg.tiles[i]];saveCfg();render()}}});
$('#grid').addEventListener('change',e=>{const r=e.target.closest('[data-t=bri]');if(r)call('light','turn_on',{entity_id:r.dataset.id,brightness_pct:+r.value})});

/* ---------- Auswahl ---------- */
let picked=new Set();
function openPick(){picked=new Set(cfg.tiles);$('#pQ').value='';pickList();$('#ovPick').classList.add('on')}
function pickList(){
  const q=$('#pQ').value.trim().toLowerCase();
  const arr=Object.values(states).filter(s=>DOMS.includes(dom(s.entity_id))&&(!q||(name(s)+' '+s.entity_id).toLowerCase().includes(q)))
    .sort((a,b)=>DOMS.indexOf(dom(a.entity_id))-DOMS.indexOf(dom(b.entity_id))||name(a).localeCompare(name(b),'de')).slice(0,150);
  $('#pList').innerHTML=arr.length?arr.map(s=>`<button class="it ${picked.has(s.entity_id)?'sel':''}" data-id="${esc(s.entity_id)}"><span class="ico" style="font-size:22px">${ICON[dom(s.entity_id)]||'•'}</span><span style="min-width:0"><b>${esc(name(s))}</b><small>${esc(s.entity_id)}</small></span><span class="chk">${picked.has(s.entity_id)?'✓':''}</span></button>`).join(''):'<div class="hint">Nichts gefunden – oder noch nicht verbunden.</div>'}
$('#pQ').addEventListener('input',pickList);
$('#pList').addEventListener('click',e=>{const b=e.target.closest('.it');if(!b)return;const id=b.dataset.id;picked.has(id)?picked.delete(id):picked.add(id);
  cfg.tiles=cfg.tiles.filter(x=>picked.has(x)).concat([...picked].filter(x=>!cfg.tiles.includes(x)));saveCfg();pickList();render()});
$('#pDone').onclick=()=>$('#ovPick').classList.remove('on');

/* ---------- Einstellungen ---------- */
function openSet(){$('#cUrl').value=cfg.url;$('#cTok').value=cfg.token;$('#cDimA').value=cfg.dimA;$('#cDimB').value=cfg.dimB;$('#ovSet').classList.add('on')}
$('#bSet').onclick=()=>{$('#cErr').textContent='';openSet()};
$('#cClose').onclick=()=>$('#ovSet').classList.remove('on');
$('#cSave').onclick=()=>{cfg.url=$('#cUrl').value.trim();cfg.token=$('#cTok').value.trim();cfg.dimA=$('#cDimA').value.trim();cfg.dimB=$('#cDimB').value.trim();saveCfg();$('#cErr').textContent='';$('#ovSet').classList.remove('on');connect()};
$('#bEdit').onclick=()=>{editing=!editing;render()};
$('#bFs').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(()=>{})};

/* ---------- Uhr, Dimmen, Bildschirm an ---------- */
const DAYS=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'],MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function inDim(now){const p=x=>{const m=/^(\d{1,2}):(\d{2})$/.exec(x||'');return m?+m[1]*60+ +m[2]:null},a=p(cfg.dimA),b=p(cfg.dimB),n=now.getHours()*60+now.getMinutes();
  if(a==null||b==null)return false;return a<=b?(n>=a&&n<b):(n>=a||n<b)}
function tick(){const n=new Date();$('#clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const h=n.getHours();$('#greet').textContent=DAYS[n.getDay()]+', '+n.getDate()+'. '+MON[n.getMonth()];
  $('#dim').style.opacity=inDim(n)?.85:0}
setInterval(tick,5000);tick();
let wl=null;async function keepAwake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{keepAwake();if(document.visibilityState==='visible'&&status==='er')connect()});
document.addEventListener('click',()=>{if(!wl)keepAwake()},{once:false});keepAwake();
addEventListener('online',connect);
if('serviceWorker' in navigator&&false)navigator.serviceWorker.register('sw.js');

render();connect();if(!cfg.url||!cfg.token)openSet();
